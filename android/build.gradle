// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Bundle the Latin OCR model so text recognition is available without a
  // first-run Google Play Services download. OCR data never leaves the device.
  configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
      substitute module('com.google.android.gms:play-services-mlkit-text-recognition') using module('com.google.mlkit:text-recognition:16.0.1')
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
